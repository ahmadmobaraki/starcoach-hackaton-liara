<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>راهبر | نمونه‌ی استقرار</title>
    <style>
      :root {
        --bg: #f5f3ee;
        --surface: #ffffff;
        --ink: #18201d;
        --muted: #66706b;
        --line: #dde1da;
        --accent: #0f5c4e;
        --soft: #dceee8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Vazirmatn, Tahoma, sans-serif;
        line-height: 1.8;
      }
      .card {
        width: min(92vw, 680px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 20px 60px -30px rgba(24, 32, 29, 0.35);
      }
      .mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--accent);
        color: white;
        font-weight: 800;
        font-size: 20px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      h1 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 36px); line-height: 1.4; }
      p { color: var(--muted); margin: 0 0 20px; }
      .grid { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
      .cell {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: #fbfaf7;
      }
      .cell b { display: block; font-size: 18px; }
      .cell span { font-size: 11px; color: var(--muted); }
      .foot {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        color: var(--muted);
      }
      @media (max-width: 520px) {
        .card { padding: 24px; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">ر</div>
      <p class="eyebrow">نمونه‌ی استقرار با راهبر</p>
      <h1>این صفحه با موفقیت روی لیارا منتشر شد.</h1>
      <p>
        این یک سایت استاتیک کوچک برای آزمون مسیر استقرار است. اگر این صفحه را
        می‌بینید، آپلود سورس، بیلد و انتشار انجام شده است.
      </p>
      <div class="grid">
        <div class="cell"><b>۱</b><span>ساخت برنامه</span></div>
        <div class="cell"><b>۲</b><span>آپلود و بیلد</span></div>
        <div class="cell"><b>۳</b><span>انتشار و بررسی</span></div>
      </div>
      <div class="foot">
        <span>ساخته‌شده برای چالش لیارا</span>
        <span dir="ltr">github.com/liara-cloud</span>
      </div>
    </main>
  </body>
</html>
